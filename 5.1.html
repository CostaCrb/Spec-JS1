<!DOCTYPE html>
<html lang="ru">
	<head>
	<meta charset="utf-8">
	<title>Лаба 5.1</title>
	</head>
	<body>
		<h1>Лабораторная 5.1</h1>

		<script>			
			var openInNewWindow;

			class Link {
			
				title;
				link;
				openInNewWindow;

				constructor (title, link, openInNewWindow){
					this.title = title;
					this.link = link;
					this.openInNewWindow = openInNewWindow;
					}	
				
				render (openInNewWindow) {
					if (this.openInNewWindow)
						document.write ( `<a href="${this.link}" target="_blank">${this.title}</a><br/> ` );
					else 
						document.write ( `<a href="${this.link}">${this.title}</a><br/> ` );
					}

			}
		
			
			let link1 = new Link ('Ссылка 1', 'https://wikipedia.org', 1);
			let link2 = new Link ('Ссылка 2', 'https://google.com', 0);
			let link3 = new Link ('Ссылка 3', 'https://wikipedia.org', 0);
			let link4 = new Link ('Ссылка 4', 'https://google.com', 1);

			link1.render();
			link2.render();
			link3.render();
			link4.render();


		</script>
	</body>
</html>
